<a href="#main" class="sr-only z-[60] rounded-md bg-primary px-4 py-2 font-semibold text-primary-foreground focus:not-sr-only focus:fixed focus:left-4 focus:top-4">Skip to content</a>

  <!-- ============ HEADER ============ -->
  <header data-header class="sticky top-[env(safe-area-inset-top,0px)] z-50 w-full border-b border-transparent backdrop-blur-lg transition duration-300 data-scrolled:border-border/60 data-scrolled:bg-background/80 data-scrolled:shadow-sm data-menu:border-border/60 data-menu:bg-background data-menu:shadow-none">
    <div class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 md:px-6">
      <a href="{{url:home}}" class="group flex shrink-0 items-center rounded-lg transition dark:bg-foreground dark:px-2 dark:py-1">
        <img src="{{asset}}/logo.png" alt="Adventure Park" width="454" height="192" class="h-11 w-auto transition duration-300 group-hover:scale-[1.03] sm:h-12" />
      </a>

      <nav aria-label="Main" class="hidden items-center gap-1 lg:flex">
        {{nav_desktop}}
      </nav>

      <div class="flex items-center gap-2">
        <button type="button" data-theme-toggle aria-label="Switch between light and dark mode" class="relative grid size-9 place-items-center rounded-full border bg-background/60 transition hover:scale-105 hover:bg-accent">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute size-4 rotate-90 scale-0 transition duration-300 dark:rotate-0 dark:scale-100"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute size-4 rotate-0 scale-100 transition duration-300 dark:-rotate-90 dark:scale-0"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <a href="{{url:booking}}" class="group hidden h-9 items-center gap-1 rounded-full bg-primary pl-4 pr-3 text-sm font-semibold text-primary-foreground shadow-sm transition hover:scale-[1.03] hover:shadow-md sm:inline-flex">
          Book now
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 transition-transform group-hover:translate-x-0.5"><path d="m9 18 6-6-6-6"/></svg>
        </a>
        <button id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Menu" class="group grid size-9 place-items-center rounded-full border bg-background/60 transition active:scale-90 lg:hidden">
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 group-aria-expanded:hidden"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden size-4 group-aria-expanded:block"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
    </div>

  </header>

  <!-- Mobile menu: full screen below the header (kept outside the header, whose blur would confine it) -->
  <div id="mobile-menu" class="group invisible fixed inset-x-0 bottom-0 top-[calc(4rem+env(safe-area-inset-top,0px))] z-40 overflow-y-auto overscroll-contain bg-background opacity-0 transition-[opacity,visibility] duration-300 data-open:visible data-open:opacity-100 lg:hidden">
    <div aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10 bg-grid [mask-image:radial-gradient(ellipse_90%_55%_at_50%_0%,#000_35%,transparent_100%)]"></div>
    <div aria-hidden="true" class="pointer-events-none absolute -top-24 left-1/2 -z-10 h-72 w-[36rem] max-w-[160vw] -translate-x-1/2 rounded-full bg-primary/15 blur-3xl"></div>
    <nav aria-label="Mobile" class="mx-auto flex min-h-full max-w-6xl flex-col px-4 pb-[calc(2rem+env(safe-area-inset-bottom,0px))] pt-4 md:px-6">
      <ul>
          {{nav_mobile}}
      </ul>
      <div class="mt-auto translate-y-4 pt-10 opacity-0 transition duration-500 [transition-delay:380ms] group-data-open:translate-y-0 group-data-open:opacity-100">
        <a href="{{url:booking}}" class="group/cta flex h-14 items-center justify-center gap-2 rounded-full bg-primary text-lg font-semibold text-primary-foreground shadow-lg transition active:scale-[0.98]">
          Book now <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 transition-transform group-hover/cta:translate-x-0.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>

            <a href="tel:{{tel_main}}" class="font-medium text-foreground">{{phone_main}}</a><span aria-hidden="true">·</span><a href="tel:{{tel_wa}}" class="font-medium text-foreground">{{phone_wa}}</a></p>
          <p class="flex items-center gap-2.5"><svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 shrink-0 text-primary-ink"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <a href="mailto:{{email}}" class="break-all font-medium text-foreground">{{email}}</a></p>

    </nav>
  </div>
