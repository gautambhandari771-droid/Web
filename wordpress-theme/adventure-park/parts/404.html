<main id="main">
    <section data-hero class="relative isolate overflow-hidden">
      <div aria-hidden="true" class="absolute inset-0 -z-10 bg-grid [mask-image:radial-gradient(ellipse_70%_70%_at_50%_0%,#000_45%,transparent_100%)]"></div>
      <!-- Hover effects (assets/hero-fx.js): the glow drifts toward the pointer, dashes gather around it -->
      <div data-hero-glow aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10 transition-transform duration-[1400ms] ease-out will-change-transform [transform:translate3d(var(--gx,0px),var(--gy,0px),0)]">
        <div class="absolute -top-40 left-1/2 h-[26rem] w-[44rem] max-w-[150vw] -translate-x-1/2 rounded-full bg-primary/20 blur-3xl"></div>
      </div>
      <canvas data-hero-canvas aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10 size-full"></canvas>
      <div class="mx-auto max-w-3xl px-4 pb-24 pt-20 text-center md:px-6 md:pb-32 md:pt-28">
        <p class="group inline-flex animate-fade-up items-center gap-2 rounded-full border bg-background/70 py-1 pl-1 pr-3.5 text-sm font-medium shadow-xs backdrop-blur">
          <span aria-hidden="true" class="grid size-7 place-items-center rounded-full bg-secondary text-base leading-none transition-transform duration-300 group-hover:-rotate-12 group-hover:scale-110">🗺️</span>
          Error 404
        </p>
        <h1 class="mt-8 animate-fade-up text-4xl font-extrabold tracking-tight [animation-delay:100ms] sm:text-5xl md:text-6xl">
          Looks like you've gone <span class="font-serif font-normal italic text-secondary-foreground">off the trail</span>
        </h1>
        <p class="mx-auto mt-6 max-w-xl animate-fade-up text-lg leading-relaxed text-muted-foreground [animation-delay:200ms]">
          The page you're looking for doesn't exist or has moved. Let's get you back on track.
        </p>
        <div class="mt-10 flex animate-fade-up flex-col items-center justify-center gap-3 [animation-delay:300ms] sm:flex-row">
          <a href="{{url:home}}" class="group inline-flex h-12 items-center gap-2 rounded-full bg-primary px-7 font-semibold text-primary-foreground shadow-lg transition hover:scale-[1.03] hover:shadow-xl">
            Back to home
            <svg aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 transition-transform group-hover:translate-x-0.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </a>
          <a href="{{url:contact}}" class="inline-flex h-12 items-center gap-2 rounded-full border bg-background/60 px-7 font-semibold backdrop-blur transition hover:bg-accent hover:text-accent-foreground">Contact us</a>
        </div>
      </div>
    </section>
  </main>
