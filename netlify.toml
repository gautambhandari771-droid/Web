# Netlify settings. The website now lives at https://adventureprk.in, so adventureprk.netlify.app
# only forwards visitors there: Netlify publishes the netlify-forward/ folder, whose _redirects
# file sends every address to the matching page on adventureprk.in (301, permanent).
# Cloudflare doesn't read this file (see wrangler.jsonc), so its setup is unchanged.

[build]
  publish = "netlify-forward"
