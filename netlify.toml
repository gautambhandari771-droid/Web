# Netlify settings for the Adventure Park website.
# The site is plain HTML/CSS/JS, so there is no build step: Netlify publishes this folder as-is.
# Unknown addresses automatically show 404.html.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
