<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Adventure Park Device Preview</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="assets/fonts.css?v=49df8bf3ce" />
  <link rel="stylesheet" href="assets/preview.css?v=4448877e09" />
</head>
<!-- data-site-root: folder of the site pages, relative to this file ("" when this file sits next to index.html) -->
<body data-site-root="">
  <div class="app">
    <header class="bar">
      <div class="title"><strong>Adventure Park</strong><span>Device preview</span></div>
      <div class="controls">
        <div class="seg" role="group" aria-label="Device">
          <button type="button" data-device="mobile" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/></svg>Mobile
          </button>
          <button type="button" data-device="tablet" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2.5"/><path d="M11 18h2"/></svg>Tablet
          </button>
          <button type="button" data-device="desktop" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Desktop
          </button>
          <button type="button" data-device="all" aria-pressed="false">All<span class="txt-wide">&nbsp;three</span></button>
        </div>

        <label><span hidden>Page</span>
          <select id="page" aria-label="Page">
            <option value="index.html">Home</option>
            <option value="about.html">About</option>
            <option value="booking.html">Booking</option>
            <option value="contact.html">Contact</option>
          </select>
        </label>

        <div class="seg" role="group" aria-label="Site colour mode">
          <button type="button" data-mode="light" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light
          </button>
          <button type="button" data-mode="dark" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>Dark
          </button>
        </div>

        <button type="button" id="rotate" class="icon-btn" aria-label="Rotate phone and tablet" title="Rotate phone and tablet">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <span class="zoom" id="zoom" title="Scale of the preview">100%</span>
        <a id="open" class="open" href="index.html" target="_blank" rel="noopener">Open page
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
      </div>
    </header>

    <main class="stage" id="stage">
      <div class="devices" id="devices"></div>
      <p class="blocked" id="blocked" hidden>
        This browser blocked the embedded preview. Open the pages directly:
        <a data-page-link href="index.html">Home</a> · <a data-page-link href="about.html">About</a> ·
        <a data-page-link href="booking.html">Booking</a> · <a data-page-link href="contact.html">Contact</a>
      </p>
    </main>
  </div>

  <script src="assets/preview.js?v=dded690556"></script>
</body>
</html>
